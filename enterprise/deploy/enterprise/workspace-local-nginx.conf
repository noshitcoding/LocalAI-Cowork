server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $workspace_backend workspace:8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location ^~ /management/runner/ { return 404; }
    # Forward the discovery probe so its 404 retains the server's desktop CORS headers.
    location ~ ^/(management/v1/|api/v1/|healthz$|readyz$) {
        proxy_pass http://$workspace_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
        client_max_body_size 2m;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
    }
}
