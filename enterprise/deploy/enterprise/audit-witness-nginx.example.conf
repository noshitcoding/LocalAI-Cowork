# Install on the independent witness host; supply its real DNS/TLS identity.
server {
    listen 443 ssl;
    server_name audit-witness.example.com;
    ssl_certificate /etc/cowork-audit-witness/fullchain.pem;
    ssl_certificate_key /etc/cowork-audit-witness/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 32m;
    location = /anchors {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18095;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Authorization $http_authorization;
    }
    location / { return 404; }
}
