name: cowork-management
services:
  management:
    cpus: 2
    mem_limit: 1024m
    pids_limit: 256
    image: ${COWORK_SERVER_IMAGE:?Set a digest-pinned enterprise server image}
    restart: unless-stopped
    environment:
      COWORK_MODE: management
      COWORK_LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL_FILE: /run/secrets/management_database_url
      COWORK_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      COWORK_MANAGEMENT_AUDIT_KEY_FILE: /run/secrets/audit_key
      COWORK_AUTH_MASTER_KEY_FILE: /run/secrets/auth_master_key
      COWORK_PROVISIONER_TOKEN_FILE: /run/secrets/provisioner_token
      COWORK_MANAGEMENT_POLICY_CEILING_FILE: /etc/cowork/platform-policy.json
      COWORK_WEB_PUSH_ENABLED: "false"
    secrets: [management_database_url, bootstrap_token, audit_key, auth_master_key, provisioner_token]
    configs:
      - source: platform_policy
        target: /etc/cowork/platform-policy.json
    ports:
      - "127.0.0.1:${COWORK_MANAGEMENT_PORT:-8081}:8080"
    networks: [services, routing]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
  web:
    cpus: .25
    mem_limit: 128m
    pids_limit: 64
    image: ${COWORK_WEB_IMAGE:?Set a digest-pinned web image built with the enterprise route}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [routing]
    ports:
      - "127.0.0.1:${COWORK_MANAGEMENT_WEB_PORT:-8082}:8080"
    depends_on:
      management:
        condition: service_healthy
    configs:
      - source: management_nginx
        target: /etc/nginx/conf.d/default.conf
configs:
  management_nginx:
    file: ./management-nginx.conf
  platform_policy:
    file: ${COWORK_PLATFORM_POLICY_FILE:-./platform-policy.example.json}
networks:
  services:
    name: cowork-services
    external: true
  routing:
    name: cowork-routing
    external: true
secrets:
  auth_master_key:
    file: ${COWORK_MANAGEMENT_SECRETS}/auth_master_key
  management_database_url:
    file: ${COWORK_MANAGEMENT_SECRETS:?Set a private secrets directory}/management_database_url
  bootstrap_token:
    file: ${COWORK_MANAGEMENT_SECRETS}/bootstrap_token
  audit_key:
    file: ${COWORK_MANAGEMENT_SECRETS}/audit_key
  provisioner_token:
    file: ${COWORK_MANAGEMENT_SECRETS}/provisioner_token
