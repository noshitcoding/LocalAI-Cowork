server {
    listen 8080;
    server_name _;
    # Docker may assign a new address after a service or daemon restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $management_backend management:8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    include /etc/nginx/cowork-compat/*.conf;

    location = / { absolute_redirect off; return 302 /management; }
    # Infrastructure credentials and claiming are available only through the
    # operator's private management listener, never the public web gateway.
    location ^~ /management/runner/ { return 404; }
    location ^~ /instances/ { return 404; }
    location ~ ^/(management/v1/|api/v1/|healthz$|readyz$) {
        proxy_pass http://$management_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
    }
}
