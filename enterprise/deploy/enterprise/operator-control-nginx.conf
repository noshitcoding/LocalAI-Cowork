server {
    listen 8443 ssl;
    server_name operator-control;
    ssl_certificate /run/secrets/control_tls_certificate;
    ssl_certificate_key /run/secrets/control_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $management_backend management:8080;
    location = /readyz { proxy_pass http://$management_backend; }
    location ^~ /management/runner/v1/ {
        proxy_pass http://$management_backend;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location / { return 404; }
}
