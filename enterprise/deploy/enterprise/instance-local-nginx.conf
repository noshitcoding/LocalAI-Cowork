map $http_upgrade $instance_connection { default upgrade; '' close; }
server {
    listen 8080 default_server;
    server_name _;
    return 404;
}
server {
    listen 8080;
    server_name "~^(?<instance>[0-9a-f]{32})\.localhost$";
    resolver 127.0.0.11 valid=5s ipv6=off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location ^~ /management/runner/ { return 404; }
    location ~ ^/(management/v1/|api/v1/|healthz$|readyz$) {
        proxy_pass http://cowork-$instance-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $instance_connection;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 32m;
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-store; }
}
