# Docker Desktop operator profile. Only the trusted provisioner/runner own the Docker socket.
name: cowork-enterprise-local
x-server: &server
  cpus: 2
  mem_limit: 1024m
  pids_limit: 256
  image: cowork-server:local-review
  build:
    context: ../..
    dockerfile: server/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, curl, --fail, --silent, "http://127.0.0.1:8080/readyz"]
    interval: 5s
    timeout: 3s
    retries: 20
x-web: &web
  cpus: .25
  mem_limit: 128m
  pids_limit: 64
  image: cowork-web:local-review
  build:
    context: ../..
    dockerfile: app/Dockerfile.web
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  management-db:
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cowork_management
      POSTGRES_DB: cowork_management
      POSTGRES_PASSWORD_FILE: /run/secrets/management_db_password
    secrets: [management_db_password]
    volumes: [management-db:/var/lib/postgresql/data]
    networks: [management]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cowork_management -d cowork_management"]
      interval: 3s
      timeout: 3s
      retries: 20
  workspace-db:
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cowork_workspace
      POSTGRES_DB: cowork_workspace
      POSTGRES_PASSWORD_FILE: /run/secrets/workspace_db_password
    secrets: [workspace_db_password]
    volumes: [workspace-db:/var/lib/postgresql/data]
    networks: [workspace]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cowork_workspace -d cowork_workspace"]
      interval: 3s
      timeout: 3s
      retries: 20
  management:
    <<: *server
    environment:
      COWORK_MODE: management
      DATABASE_URL_FILE: /run/secrets/management_database_url
      COWORK_BOOTSTRAP_TOKEN_FILE: /run/secrets/management_bootstrap
      COWORK_MANAGEMENT_AUDIT_KEY_FILE: /run/secrets/audit_key
      COWORK_AUTH_MASTER_KEY_FILE: /run/secrets/auth_master_key
      COWORK_MANAGEMENT_PROVISIONING_ENABLED: "true"
      COWORK_MANAGEMENT_BACKUPS_ENABLED: "true"
      COWORK_MANAGEMENT_UPDATES_ENABLED: "true"
      COWORK_MANAGEMENT_RELEASE_SELECTION_ENABLED: "${COWORK_MANAGEMENT_RELEASE_SELECTION_ENABLED:-false}"
      COWORK_MANAGEMENT_DELETION_ENABLED: "true"
      COWORK_PROVISIONER_TOKEN_FILE: /run/secrets/provisioner_token
      COWORK_INSTANCE_URL_TEMPLATE: "http://{instance}.localhost:18084"
      COWORK_DESKTOP_ORIGINS: "http://127.0.0.1:5173"
      COWORK_WEB_PUSH_ENABLED: "false"
    secrets: [management_database_url, management_bootstrap, audit_key, auth_master_key, provisioner_token]
    networks:
      management: {}
      fleet-services:
        aliases: [fleet-management]
      fleet-routing:
        aliases: [fleet-management]
    depends_on:
      management-db: {condition: service_healthy}
  workspace:
    <<: *server
    environment:
      COWORK_MODE: api
      DATABASE_URL_FILE: /run/secrets/workspace_database_url
      COWORK_BOOTSTRAP_TOKEN_FILE: /run/secrets/workspace_bootstrap
      COWORK_DESKTOP_ORIGINS: "http://127.0.0.1:5173"
      COWORK_SERVER_CAPABILITIES: ""
      COWORK_WEB_PUSH_ENABLED: "false"
    secrets: [workspace_database_url, workspace_bootstrap]
    networks: [workspace]
    depends_on:
      workspace-db: {condition: service_healthy}
  management-web:
    <<: *web
    ports: ["127.0.0.1:18082:8080"]
    networks: [management]
    configs:
      - source: management_nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      management: {condition: service_healthy}
  workspace-web:
    <<: *web
    ports: ["127.0.0.1:18083:8080"]
    networks: [workspace]
    configs:
      - source: workspace_nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      workspace: {condition: service_healthy}
  fleet-db:
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cowork_fleet
      POSTGRES_DB: cowork_fleet
      POSTGRES_PASSWORD_FILE: /run/secrets/fleet_db_password
    secrets: [fleet_db_password]
    volumes: [fleet-db:/var/lib/postgresql/data]
    networks: [fleet-services]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cowork_fleet -d cowork_fleet"]
      interval: 3s
      timeout: 3s
      retries: 20
  fleet-storage:
    cpus: 2
    mem_limit: 1024m
    pids_limit: 256
    image: cowork-storage:local-review
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/enterprise/storage.Dockerfile
    command: [server, /data]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/fleet_s3_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/fleet_s3_password
    secrets: [fleet_s3_user, fleet_s3_password]
    volumes: [fleet-storage:/data]
    networks: [fleet-services]
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  operator-control:
    <<: *web
    networks: [management]
    configs:
      - source: operator_control_nginx
        target: /etc/nginx/conf.d/default.conf
    secrets: [control_tls_certificate, control_tls_key]
    depends_on:
      management: {condition: service_healthy}
  provisioner:
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    image: cowork-provisioner:local-review
    build:
      context: ../..
      dockerfile: server/cowork-provisioner/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Independent namespace: a management restart must not detach the operator.
    # Authentication uses its private token on these trusted service networks.
    networks: [management, fleet-services]
    environment:
      COWORK_PROVISIONER_VOLUME: cowork-enterprise-local-fleet-state
      COWORK_PROVISIONER_STATE: /var/lib/docker/volumes/cowork-enterprise-local-fleet-state/_data
      COWORK_FLEET_HOST_CPU_MILLIS: "${COWORK_FLEET_HOST_CPU_MILLIS:-}"
      COWORK_FLEET_HOST_MEMORY_MIB: "${COWORK_FLEET_HOST_MEMORY_MIB:-}"
      COWORK_FLEET_RESERVED_CPU_MILLIS: "${COWORK_FLEET_RESERVED_CPU_MILLIS:-}"
      COWORK_FLEET_RESERVED_MEMORY_MIB: "${COWORK_FLEET_RESERVED_MEMORY_MIB:-}"
      COWORK_RELEASE_CATALOG_SYNC: "true"
      COWORK_RELEASE_SELECTION_ENABLED: "${COWORK_RELEASE_SELECTION_ENABLED:-false}"
      COWORK_INSTANCE_DELETION_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fleet-state:/var/lib/docker/volumes/cowork-enterprise-local-fleet-state/_data
    secrets: [provisioner_token, fleet_database_url, fleet_s3_user, fleet_s3_password, fleet_backup_identity, control_tls_certificate]
    depends_on:
      management: {condition: service_healthy}
      operator-control: {condition: service_started}
      fleet-db: {condition: service_healthy}
      fleet-storage: {condition: service_healthy}
  instance-web:
    <<: *web
    ports: ["127.0.0.1:18084:8080"]
    networks: [fleet-routing, fleet-edge]
    configs:
      - source: instance_nginx
        target: /etc/nginx/conf.d/default.conf
networks:
  management: {}
  workspace: {}
  fleet-services: {name: cowork-fleet-services, internal: true}
  fleet-routing: {name: cowork-fleet-routing, internal: true}
  fleet-edge: {}
volumes:
  management-db: {}
  workspace-db: {}
  fleet-db: {}
  fleet-storage: {}
  fleet-state: {name: cowork-enterprise-local-fleet-state}
configs:
  operator_control_nginx:
    file: ./operator-control-nginx.conf
  management_nginx:
    file: ./management-nginx.conf
  workspace_nginx:
    file: ./workspace-local-nginx.conf
  instance_nginx:
    file: ./instance-local-nginx.conf
secrets:
  control_tls_certificate:
    file: ../../.internal/enterprise-local/control_tls_certificate
  control_tls_key:
    file: ../../.internal/enterprise-local/control_tls_key
  auth_master_key:
    file: ../../.internal/enterprise-local/auth_master_key
  fleet_backup_identity:
    file: ../../.internal/enterprise-local/fleet_backup_identity
  provisioner_token:
    file: ../../.internal/enterprise-local/provisioner_token
  fleet_db_password:
    file: ../../.internal/enterprise-local/fleet_db_password
  fleet_database_url:
    file: ../../.internal/enterprise-local/fleet_database_url
  fleet_s3_user:
    file: ../../.internal/enterprise-local/fleet_s3_user
  fleet_s3_password:
    file: ../../.internal/enterprise-local/fleet_s3_password
  management_db_password:
    file: ../../.internal/enterprise-local/management_db_password
  workspace_db_password:
    file: ../../.internal/enterprise-local/workspace_db_password
  management_database_url:
    file: ../../.internal/enterprise-local/management_database_url
  workspace_database_url:
    file: ../../.internal/enterprise-local/workspace_database_url
  management_bootstrap:
    file: ../../.internal/enterprise-local/management_bootstrap
  workspace_bootstrap:
    file: ../../.internal/enterprise-local/workspace_bootstrap
  audit_key:
    file: ../../.internal/enterprise-local/audit_key
