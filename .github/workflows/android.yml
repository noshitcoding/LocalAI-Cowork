name: android-internal-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      VITE_COWORK_FIREBASE_PROJECT_ID: ${{ secrets.OPEN_COWORK_FIREBASE_PROJECT_ID }}
      VITE_COWORK_FIREBASE_APPLICATION_ID: ${{ secrets.OPEN_COWORK_FIREBASE_APPLICATION_ID }}
      VITE_COWORK_FIREBASE_API_KEY: ${{ secrets.OPEN_COWORK_FIREBASE_API_KEY }}
      VITE_COWORK_FIREBASE_SENDER_ID: ${{ secrets.OPEN_COWORK_FIREBASE_SENDER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            clients/android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_path}" ]]; then
            echo "Android sdkmanager is unavailable at ${sdkmanager_path}." >&2
            exit 1
          fi
          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Require signing and Firebase configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.OPEN_COWORK_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.OPEN_COWORK_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.OPEN_COWORK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            VITE_COWORK_FIREBASE_PROJECT_ID VITE_COWORK_FIREBASE_APPLICATION_ID \
            VITE_COWORK_FIREBASE_API_KEY VITE_COWORK_FIREBASE_SENDER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Android release secret ${name} is missing." >&2
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/open-cowork-android.jks"
          chmod 600 "${RUNNER_TEMP}/open-cowork-android.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/open-cowork-android.jks" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app
          npm ci --prefix clients/android

      - name: Initialize and build release APK
        working-directory: clients/android
        shell: bash
        run: |
          set -euo pipefail
          npm run android:init -- --ci
          npm run android:build -- --apk --target aarch64

      - name: Sign and verify internal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="$(find clients/android/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print -quit)"
          if [[ -z "${unsigned_apk}" ]]; then
            echo 'Tauri did not produce an unsigned release APK.' >&2
            find clients/android/src-tauri/gen/android/app/build/outputs -type f -maxdepth 8 -print || true
            exit 1
          fi
          mkdir -p android-release
          signed_apk='android-release/Open-Cowork-Android-arm64.apk'
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEY_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${signed_apk}" \
            "${unsigned_apk}"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${signed_apk}" | tee android-release/APK-SIGNATURE.txt
          sha256sum "${signed_apk}" > android-release/SHA256SUMS

      - name: Upload signed internal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-cowork-android-${{ github.ref_name }}
          path: android-release/*
          if-no-files-found: error
          retention-days: 30
