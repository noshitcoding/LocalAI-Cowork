name: V2 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-tools:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: python -m unittest discover -s tools/desktop -p "test_*.py" -v
      - run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
  documents:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/toolbox/requirements-documents.lock
      - run: python -I tools/toolbox/qualify_documents.py --install-tex
  office:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxinerama1 libxrandr2 libxrender1 libgl1 libnss3 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/toolbox/requirements-documents.lock
      - run: python -I tools/toolbox/runtime_install.py --data-dir .local/office-ci --libreoffice-only
      - run: python -I tools/toolbox/qualify_office.py --toolbox-config .local/office-ci/toolbox.json
      - run: cargo build --locked -p cowork-daemon
      - run: python -I tests/system/documents.py --toolbox-config .local/office-ci/toolbox.json
  document-ui:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/toolbox/requirements-documents.lock -r tools/toolbox/requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -I tools/toolbox/runtime_install.py --data-dir .local/tex-ui-ci --tectonic-only
      - run: cargo build --locked -p cowork-daemon
      - run: python -I tests/system/documents.py --browser --tex-config .local/tex-ui-ci/toolbox.json
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused Android SDK space on the hosted Linux runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          sdk=/usr/local/lib/android
          if test -d "$sdk"; then
            test "$(realpath -- "$sdk")" = "$sdk"
            sudo rm -rf -- "$sdk"
          fi
          df -h .
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - run: node tools/contracts/check.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: cargo build --locked -p cowork-daemon
      - run: python tests/system/durability.py
      - run: python tests/system/files.py
      - run: python tests/system/workspaces.py
      - run: python tests/system/file_operations.py
      - run: python tests/system/uploads.py
      - run: python tests/system/native_folders.py
      - run: python tests/system/model_budgets.py
      - run: python tests/system/workflows.py
      - run: python tests/system/workflow_journal.py
      - run: python tests/system/workflow_clocks.py
      - run: python tests/system/workflow_human_resume.py
      - run: python tests/system/workflow_inputs.py
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: contract
            case: postgres_same_storage_contract
          - suite: environments
            case: postgres_environment_contract
          - suite: processes
            case: postgres_process_contract
          - suite: mcp
            case: postgres_mcp_contract
          - suite: mcp_connections
            case: postgres_mcp_connection_contract
          - suite: mcp_credentials
            case: postgres_mcp_credential_contract
          - suite: native_secrets
            case: postgres_native_key_setup_contract
          - suite: workflows
            case: postgres_workflow_contract
          - suite: workflows
            case: journal_cases::postgres_workflow_journal_contract
          - suite: document_drafts
            case: postgres_document_draft_contract
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: cowork_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cowork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cowork_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      COWORK_TEST_POSTGRES: postgresql://cowork_test:disposable-ci-only@localhost:5432/cowork_test
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p cowork-storage --test ${{ matrix.suite }} ${{ matrix.case }} -- --ignored
  device-actor-postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case:
          - postgres_original_creator_scope_fences_queue_and_existing_lease_without_other_changes
          - postgres_separate_desktop_viewer_and_controller_keep_creator_and_original_rows
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: cowork_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cowork_device_actor_ci_fresh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cowork_test -d cowork_device_actor_ci_fresh"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      COWORK_DEVICE_ACTOR_PG_DATABASE_URL: postgresql://cowork_test:disposable-ci-only@localhost:5432/cowork_device_actor_ci_fresh
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p cowork-storage --test device_actor_authority_postgres -- --ignored --exact ${{ matrix.case }} --test-threads=1
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused Android SDK space on the hosted Linux runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          sdk=/usr/local/lib/android
          if test -d "$sdk"; then
            test "$(realpath -- "$sdk")" = "$sdk"
            sudo rm -rf -- "$sdk"
          fi
          df -h .
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb xauth
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build
      - run: node tools/desktop/prepare.mjs
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/system/desktop-lifetime.ps1
      - if: runner.os == 'Linux'
        run: xvfb-run -a python3 tests/system/desktop_lifetime_linux.py --desktop apps/desktop/src-tauri/target/debug/localai-cowork-v2-desktop --daemon apps/desktop/src-tauri/binaries/cowork-daemon-x86_64-unknown-linux-gnu
