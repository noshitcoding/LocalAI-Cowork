name: ci

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Python for the bundled CrewAI runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: app/src-tauri/python/crew_runtime/requirements.lock

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Install frontend dependencies
        run: |
          cd app
          npm ci

      - name: Install Chromium for UI quality gates
        working-directory: app
        run: npm exec -- playwright install --with-deps chromium

      - name: Prepare and verify bundled CrewAI runtime
        working-directory: app
        run: npm run prepare:crew-runtime -- -Force

      - name: Quality gates
        working-directory: app
        run: npm run verify

      - name: Distributed Rust workspace gates
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Distributed contract drift and N-1 compatibility
        working-directory: app
        run: npm run contracts:check

      - name: Tauri production build
        run: |
          cd app
          npm run tauri build -- --no-bundle

  local-daemon-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Install interactive Linux desktop acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth xdotool imagemagick xclip x11-utils

      - name: Linux local daemon gates
        run: |
          cargo check --locked --package cowork-local-daemon
          cargo test --locked --package cowork-local-daemon --all-targets
          cargo clippy --locked --package cowork-local-daemon --all-targets -- -D warnings

      - name: Personal Linux executor and GUI-stream acceptance
        if: always()
        run: |
          cargo check --locked --package cowork-device-agent
          xvfb-run --auto-servernum env COWORK_REQUIRE_LINUX_DESKTOP_TEST=1 cargo test --locked --package cowork-device-agent --all-targets
          cargo clippy --locked --package cowork-device-agent --all-targets -- -D warnings

  android-unsigned-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            clients/android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_path}" ]]; then
            echo "Android sdkmanager is unavailable at ${sdkmanager_path}." >&2
            exit 1
          fi
          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install locked Android and shared UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app
          npm ci --prefix clients/android

      - name: Validate Android offline shell
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app run test -- --run src/mobile/mobileOfflineStore.test.ts src/mobile/mobileSecure.test.ts
          npm --prefix app run build -- --mode android

      - name: Build unsigned ARM64 APK
        working-directory: clients/android
        shell: bash
        run: |
          set -euo pipefail
          npm run android:init -- --ci
          npm run android:build -- --apk --target aarch64

      - name: Verify unsigned APK payload
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="$(find clients/android/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print -quit)"
          if [[ -z "${unsigned_apk}" ]]; then
            echo 'Tauri did not produce an unsigned release APK.' >&2
            find clients/android/src-tauri/gen/android/app/build/outputs -type f -maxdepth 8 -print || true
            exit 1
          fi
          mkdir -p android-ci
          cp "${unsigned_apk}" android-ci/Open-Cowork-Android-arm64-unsigned.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${unsigned_apk}" > android-ci/APK-BADGING.txt
          grep -F "package: name='dev.opencowork.android'" android-ci/APK-BADGING.txt
          sha256sum android-ci/Open-Cowork-Android-arm64-unsigned.apk > android-ci/SHA256SUMS

      - name: Upload unsigned APK acceptance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-cowork-android-unsigned-${{ github.sha }}
          path: android-ci/*
          if-no-files-found: error
          retention-days: 7

  single-port-gateway:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate production Compose model
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet

      - name: Nginx-compatible TLS to Caddy acceptance
        run: node scripts/test-gateway-e2e.mjs

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0

      - name: Setup Python for dependency audit
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: app/src-tauri/python/crew_runtime/requirements.lock

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

      - name: npm audit
        run: |
          cd app
          npm audit --audit-level=high

      - name: Python dependency audit
        working-directory: app
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit \
            -r src-tauri/python/crew_runtime/requirements.lock \
            --disable-pip \
            --no-deps \
            --ignore-vuln PYSEC-2026-311 \
            --strict

      - name: Semgrep scan
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (immutable release)
        env:
          TRIVY_VEX: .vex/localai-cowork.openvex.json
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
