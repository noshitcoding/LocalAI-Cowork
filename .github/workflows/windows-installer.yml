name: windows-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      TAURI_BUILD_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Python for the bundled CrewAI runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: app/src-tauri/python/crew_runtime/requirements.lock

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium for UI quality gates
        working-directory: app
        run: npm exec -- playwright install --with-deps chromium

      - name: Prepare and verify bundled CrewAI runtime
        working-directory: app
        run: npm run prepare:crew-runtime -- -Force

      - name: Verify release source
        working-directory: app
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm run verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run supply-chain:check -- --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit pinned Python dependencies
        working-directory: app
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit `
            -r src-tauri/python/crew_runtime/requirements.lock `
            --disable-pip `
            --no-deps `
            --ignore-vuln PYSEC-2026-311 `
            --strict

      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file app/src-tauri/Cargo.lock

      - name: Build Windows installer
        working-directory: app
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'localai-cowork-target'
          npm run installer

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath dist-installers\LocalAI-Cowork-Setup.exe -Destination release-assets\LocalAI-Cowork-Setup-x64.exe -Force

      - name: Verify installed CrewAI payload
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.tag }}".TrimStart('v')
          .\app\scripts\installer-crew-runtime-smoke.ps1 `
            -InstallerPath release-assets\LocalAI-Cowork-Setup-x64.exe `
            -ExpectedVersion $version `
            -UninstallAfterVerification

      - name: Resolve installer signing mode
        id: signing_mode
        shell: pwsh
        env:
          LOCALAI_COWORK_ALLOW_UNSIGNED_RELEASE: ${{ vars.LOCALAI_COWORK_ALLOW_UNSIGNED_RELEASE }}
          LOCALAI_COWORK_CODESIGN_PFX_BASE64: ${{ secrets.LOCALAI_COWORK_CODESIGN_PFX_BASE64 || secrets.OPEN_COWORK_CODESIGN_PFX_BASE64 }}
          LOCALAI_COWORK_CODESIGN_PASSWORD: ${{ secrets.LOCALAI_COWORK_CODESIGN_PASSWORD || secrets.OPEN_COWORK_CODESIGN_PASSWORD }}
          LOCALAI_COWORK_CODESIGN_THUMBPRINT: ${{ secrets.LOCALAI_COWORK_CODESIGN_THUMBPRINT || secrets.OPEN_COWORK_CODESIGN_THUMBPRINT }}
        run: |
          $signingValues = @(
            $env:LOCALAI_COWORK_CODESIGN_PFX_BASE64
            $env:LOCALAI_COWORK_CODESIGN_PASSWORD
            $env:LOCALAI_COWORK_CODESIGN_THUMBPRINT
          )
          $configuredValues = @($signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count

          if ($configuredValues -eq $signingValues.Count) {
            "sign=true" >> $env:GITHUB_OUTPUT
            "unsigned=false" >> $env:GITHUB_OUTPUT
            "release_notice=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($configuredValues -ne 0) {
            throw 'The Authenticode configuration is incomplete. Configure all three code-signing secrets.'
          }
          if ($env:LOCALAI_COWORK_ALLOW_UNSIGNED_RELEASE -ne 'true') {
            throw 'Authenticode secrets are required unless the LOCALAI_COWORK_ALLOW_UNSIGNED_RELEASE repository variable is explicitly set to true.'
          }

          "sign=false" >> $env:GITHUB_OUTPUT
          "unsigned=true" >> $env:GITHUB_OUTPUT
          "release_notice=WARNING: The Windows installer in this release is not Authenticode-signed. Windows may display Unknown publisher. Verify SHA256SUMS and the GitHub artifact attestations before running it." >> $env:GITHUB_OUTPUT
          @"
          WARNING: This Windows installer is not Authenticode-signed.
          Windows may display "Unknown publisher".

          Release: ${{ steps.release.outputs.tag }}
          Commit: ${{ github.sha }}

          Verify SHA256SUMS and the GitHub artifact attestations before running it.
          This exception required the LOCALAI_COWORK_ALLOW_UNSIGNED_RELEASE repository variable.
          "@ | Set-Content -LiteralPath release-assets\UNSIGNED-WINDOWS-INSTALLER.txt -Encoding utf8

      - name: Sign and verify Windows installer
        if: ${{ steps.signing_mode.outputs.sign == 'true' }}
        shell: pwsh
        env:
          LOCALAI_COWORK_CODESIGN_PFX_BASE64: ${{ secrets.LOCALAI_COWORK_CODESIGN_PFX_BASE64 || secrets.OPEN_COWORK_CODESIGN_PFX_BASE64 }}
          LOCALAI_COWORK_CODESIGN_PASSWORD: ${{ secrets.LOCALAI_COWORK_CODESIGN_PASSWORD || secrets.OPEN_COWORK_CODESIGN_PASSWORD }}
          LOCALAI_COWORK_CODESIGN_THUMBPRINT: ${{ secrets.LOCALAI_COWORK_CODESIGN_THUMBPRINT || secrets.OPEN_COWORK_CODESIGN_THUMBPRINT }}
        run: |
          .\app\scripts\sign-windows-installer.ps1 -InstallerPath release-assets\LocalAI-Cowork-Setup-x64.exe

      - name: Verify unsigned installer exception
        if: ${{ steps.signing_mode.outputs.unsigned == 'true' }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath release-assets\LocalAI-Cowork-Setup-x64.exe
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer, but Authenticode reported $($signature.Status)."
          }

      - name: Generate SBOM, notices, provenance, and checksums
        working-directory: app
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm run supply-chain:sbom -- --output ..\release-assets --tag "$env:RELEASE_TAG"
          npm run supply-chain:release -- --output ..\release-assets --tag "$env:RELEASE_TAG"

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*

      - name: Attest installer SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-assets/LocalAI-Cowork-Setup-x64.exe
          sbom-path: release-assets/localai-cowork.cdx.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalAI-Cowork-Windows-Installer
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: LocalAI Cowork ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: ${{ steps.signing_mode.outputs.release_notice }}
          files: release-assets/*
