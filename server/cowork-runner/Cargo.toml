[package]
name = "cowork-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardened Docker boundary for Open Cowork job sandboxes"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.10"
cowork-contracts = { path = "../../crates/cowork-contracts" }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2.6"
tokio = { workspace = true, features = ["io-util", "net", "process", "sync"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
