[package]
name = "cowork-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Open Cowork single-host control plane and durable worker"

[dependencies]
anyhow.workspace = true
aes-gcm = "0.10"
async-trait.workspace = true
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono.workspace = true
chrono-tz = "0.10"
cowork-contracts = { path = "../../crates/cowork-contracts" }
cowork-runtime = { path = "../../crates/cowork-runtime" }
cron = "0.15"
diffy = "0.4"
dotenvy = "0.15"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
getrandom = "0.4"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
web-push-native = "0.4"
webauthn-rs = { version = "0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
openssl = { version = "0.10", features = ["vendored"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
