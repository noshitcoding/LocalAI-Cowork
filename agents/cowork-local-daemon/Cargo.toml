[package]
name = "cowork-local-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-user offline Open Cowork daemon with durable SQLite runs"

[features]
default = []
tauri-shell = []

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
chrono-tz = "0.10"
cowork-contracts = { path = "../../crates/cowork-contracts" }
cowork-runtime = { path = "../../crates/cowork-runtime" }
cron = "0.15"
image = { version = "0.25", default-features = true }
glob = "0.3"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
pdf-extract = "0.12"
pdfium-render = { version = "0.8.36", default-features = false, features = ["pdfium_latest", "thread_safe", "image"] }
quick-xml = "0.38"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
uuid.workspace = true
url = "2"
walkdir = "2.5"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
