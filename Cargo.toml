[workspace]
members = [
    "crates/cowork-contracts",
    "crates/cowork-runtime",
    "server/cowork-server",
    "server/cowork-runner",
    "agents/cowork-device-agent",
    "agents/cowork-local-daemon",
]
exclude = ["app/src-tauri", "clients/android/src-tauri", "clients/android/plugins/mobile-secure", "clients/android/plugins/mobile-push"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/noshitcoding/LocalAI-Cowork"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
