services:
  api:
    environment:
      COWORK_S3_ACCESS_KEY_ID_FILE: /run/secrets/external_s3_access_key
      COWORK_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/external_s3_secret_key
    secrets: [postgres_password, external_s3_access_key, external_s3_secret_key]
  worker:
    environment:
      COWORK_S3_ACCESS_KEY_ID_FILE: /run/secrets/external_s3_access_key
      COWORK_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/external_s3_secret_key
    secrets: [postgres_password, external_s3_access_key, external_s3_secret_key]
secrets:
  external_s3_access_key:
    file: "${COWORK_DEPLOY_ROOT:?}/secrets/${COWORK_S3_ACCESS_KEY_FILENAME:?}"
  external_s3_secret_key:
    file: "${COWORK_DEPLOY_ROOT:?}/secrets/${COWORK_S3_SECRET_KEY_FILENAME:?}"
