name: open-cowork-gateway-e2e

services:
  caddy:
    image: caddy:2.10.0-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../security/web-headers.caddy:/etc/caddy/web-headers.caddy:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy
      - upstream
    read_only: true
    tmpfs: [/config, /data]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  npm-proxy:
    image: nginx:1.29-alpine
    user: "101:101"
    depends_on: [caddy]
    ports:
      - "127.0.0.1:${COWORK_GATEWAY_E2E_PORT:-18443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${COWORK_GATEWAY_E2E_CERT_ROOT:?certificate directory is required}:/certs:ro
    networks: [edge, proxy]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1770
      - /var/run:uid=101,gid=101,mode=1770
      - /tmp:uid=101,gid=101,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  edge: {}
  proxy:
    internal: true
  upstream: {}
