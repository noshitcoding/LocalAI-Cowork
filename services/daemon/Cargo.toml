[package]
name = "cowork-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "managed_controller_probe"
path = "src/managed_controller_probe.rs"

[dependencies]
cowork-contracts.workspace = true
cowork-workflow-contracts.workspace = true
cowork-domain.workspace = true
cowork-storage.workspace = true
cowork-runtime.workspace = true
cowork-mcp.workspace = true
cowork-runner-protocol.workspace = true
async-trait.workspace = true
cowork-broker.workspace = true
cowork-secrets.workspace = true
cowork-identity.workspace = true
cowork-toolbox.workspace = true
ring.workspace = true
base64 = "=0.22.1"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
reqwest.workspace = true
sha2.workspace = true
chrono.workspace = true
hmac = "0.12"
zeroize.workspace = true
axum.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = {version="=0.30.0",default-features=false}
tokio-rustls = {version="0.26",default-features=false,features=["ring","tls12"]}
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
hyper = {version="1",features=["server","http1"]}
hyper-util = {version="0.1",features=["tokio"]}
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
anyhow.workspace = true
portable-pty = "=0.9.0"

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
